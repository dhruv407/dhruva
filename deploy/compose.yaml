services:
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: rg
      POSTGRES_DB: rgstock
      POSTGRES_PASSWORD: ${RG_DB_PASSWORD:?Set a unique staging database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rg -d rgstock"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    image: rg-stock-engine:staging
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://rg:${RG_DB_PASSWORD}@db:5432/rgstock
      RG_DATA_DIR: /workspace/dhruva/data
      RG_AI_API_KEY: ${RG_AI_API_KEY:-}
      RG_AI_MODEL: ${RG_AI_MODEL:-gpt-4.1-mini}
      NO_PROXY: db,app,proxy,localhost,127.0.0.1,::1
      no_proxy: db,app,proxy,localhost,127.0.0.1,::1
    volumes:
      - ${RG_DATA_DIRECTORY:-./staging-data}:/workspace/dhruva/data
  proxy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      RG_DOMAIN: ${RG_DOMAIN:?Set the staging hostname}
      RG_AUTH_USER: ${RG_AUTH_USER:?Set the staging login name}
      RG_AUTH_HASH: ${RG_AUTH_HASH:?Set a Caddy bcrypt password hash}
      NO_PROXY: db,app,proxy,localhost,127.0.0.1,::1
      no_proxy: db,app,proxy,localhost,127.0.0.1,::1
    ports:
      - ${RG_BIND_ADDRESS:-127.0.0.1}:${RG_HTTP_PORT:-80}:80
      - ${RG_BIND_ADDRESS:-127.0.0.1}:${RG_HTTPS_PORT:-443}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
