[project]
name = "rg-stock-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "openpyxl>=3.1,<4",
  "python-multipart>=0.0.20",
  "ortools>=9.12,<10",
  "pydantic>=2.10,<3",
  "xlrd>=2.0,<3",
  "openai>=1.75,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
